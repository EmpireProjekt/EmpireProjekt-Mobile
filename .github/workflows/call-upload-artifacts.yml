name: "Build And Upload Release Artifacts"
on:
  workflow_call:
    secrets:
      KLIBS_KEY_ALIAS:
        required: true
      KLIBS_KEY_PASSWORD:
        required: true
      KLIBS_STORE_PASSWORD:
        required: true
      KLIBS_KEYSTORE_BASE64:
        required: true
      KLIBS_GSERVICES_BASE64:
        required: true
jobs:
  build_and_upload_release_artifacts:
    name: "Build And Upload ${{ matrix.platform }} Release"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: "android"
            gradle_task: ":instances:androidApp:assembleRelease :instances:androidApp:bundleRelease"
            apk_path: "instances/androidApp/build/outputs/apk/release"
            bundle_path: "instances/androidApp/build/outputs/bundle/release"
          - platform: "wearos"
            gradle_task: ":instances:wearApp:assembleRelease"
            apk_path: "instances/wearApp/build/outputs/apk/release"
            bundle_path: ""
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Set Up JDK 21"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: "Set Up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: "Make gradlew Executable"
        run: chmod +x gradlew
      - name: "Assemble Signed ${{ matrix.platform }} Release"
        env:
          # ApkSigningPlugin reads these through secretProperty, so they stay unprefixed
          KEY_ALIAS: ${{ secrets.KLIBS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KLIBS_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KLIBS_STORE_PASSWORD }}
          # The instances read these through klibsSecretProperty, which prefixes the key with "klibs."
          klibs_KEYSTORE_BASE64: ${{ secrets.KLIBS_KEYSTORE_BASE64 }}
          klibs_GSERVICES_BASE64: ${{ secrets.KLIBS_GSERVICES_BASE64 }}
        run: ./gradlew ${{ matrix.gradle_task }} --stacktrace
      - name: "Upload ${{ matrix.platform }} Release To Run Artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ matrix.apk_path }}
            ${{ matrix.bundle_path }}
