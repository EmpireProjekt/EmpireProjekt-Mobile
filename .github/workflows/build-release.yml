name: Build Release
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate_gradle_wrapper:
    name: "Gradle Wrapper"
    uses: ./.github/workflows/call-gradle-wrapper-validation.yml
  build_release_artifacts:
    name: "Release Artifacts"
    needs: [ validate_gradle_wrapper ]
    uses: ./.github/workflows/call-upload-artifacts.yml
    secrets:
      KLIBS_KEY_ALIAS: ${{ secrets.KLIBS_KEY_ALIAS }}
      KLIBS_KEY_PASSWORD: ${{ secrets.KLIBS_KEY_PASSWORD }}
      KLIBS_STORE_PASSWORD: ${{ secrets.KLIBS_STORE_PASSWORD }}
      KLIBS_KEYSTORE_BASE64: ${{ secrets.KLIBS_KEYSTORE_BASE64 }}
      KLIBS_GSERVICES_BASE64: ${{ secrets.KLIBS_GSERVICES_BASE64 }}
  publish_github_release:
    name: "GitHub Release"
    needs: [ validate_gradle_wrapper, build_release_artifacts ]
    permissions:
      contents: write
    uses: ./.github/workflows/call-upload-github-release.yml
    secrets:
      ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
