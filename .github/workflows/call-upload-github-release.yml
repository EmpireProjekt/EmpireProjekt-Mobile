name: "Publish GitHub Release"
on:
  workflow_call:
    secrets:
      ACTIONS_TOKEN:
        description: "Optional personal access token used to create the release. Falls back to the default GITHUB_TOKEN when not provided."
        required: false

permissions:
  contents: write

jobs:
  publish_github_release:
    name: "Publish Android And WearOS Releases To GitHub Releases"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Read Project Name And Version From gradle.properties"
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        id: properties
        with:
          path: './gradle.properties'
          properties: 'klibs.project.name klibs.project.version.string'

      - name: "Download Release Artifacts From Run Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'release-*'
          path: ./artifacts

      - name: "Create GitHub Release With APK And AAB"
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN || github.token }}
        with:
          files: |
            ./artifacts/**/*.apk
            ./artifacts/**/*.aab
          tag_name: ${{ steps.properties.outputs.klibs-project-version-string }}
          name: ${{ steps.properties.outputs.klibs-project-name }} - ${{ steps.properties.outputs.klibs-project-version-string }}
          draft: false
          prerelease: false
