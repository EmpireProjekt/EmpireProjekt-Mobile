name: "Validate Kotlin and architecture"
on:
  workflow_call:
jobs:
  run_detekt:
    name: "Validate Kotlin and architecture"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Set Up JDK 21"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: "Set Up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: "Make gradlew Executable"
        run: chmod +x gradlew
      - name: "Validate Kotlin and architecture"
        run: ./gradlew architectureLint --no-configure-on-demand --continue --stacktrace
      - name: Upload API ownership report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-ownership-report
          path: build/reports/architecture/api-ownership.txt
          if-no-files-found: warn
